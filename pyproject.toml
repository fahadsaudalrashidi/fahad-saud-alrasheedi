[project]
name = "support-intelligence-platform"
version = "1.0.0"
description = "FastAPI support intelligence backend and pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
streaming = ["kafka-python-ng>=2.2,<3"]
lakehouse = ["pyspark==3.5.1", "delta-spark==3.2.0", "pyarrow>=15"]
quality = ["great-expectations>=1,<2", "openlineage-python>=1.20,<2", "pandas>=2,<4"]
rag = ["sentence-transformers>=3,<6", "qdrant-client>=1.12,<2", "rank-bm25>=0.2.2,<1"]
full-pipeline = [
  "kafka-python-ng>=2.2,<3",
  "pyspark==3.5.1",
  "delta-spark==3.2.0",
  "pyarrow>=15",
  "great-expectations>=1,<2",
  "openlineage-python>=1.20,<2",
  "pandas>=2,<4",
  "sentence-transformers>=3,<6",
  "qdrant-client>=1.12,<2",
  "rank-bm25>=0.2.2,<1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
